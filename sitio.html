<!DOCTYPE html>
<html lang="en">
<head>
<title>Amazon</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

header {
  background-color: #232F3E;
  padding: 5px;
  text-align: center;
  font-size: 25px;
  color: white;
}
nav {
  float: up;
  width: 100%;
  height: 7vh;
  background: #333e48;
  padding: 20px; 
}

nav ul {
  list-style-type: none;
  padding: 0;
}

article {
  float: center;
  padding: 20px;
  width: 100  %;
  background-color: #f1f1f1;

}

section::after {
  content: "";
  display: table;
  clear: both;
}

footer {
  background-color: #333e48;
  padding: 10px;
  text-align: center;
  color: white;
}

.contenedor {
  display: flex;
  justify-content: flex-end;
  gap: 713px;
  align-items: center;
}

.mi-imagen {
  width: 300px;
  height: 200px;
}



@media (max-width: 600px) {
  nav, article {
    width: 100%;
    height: auto;
  }
}
</style>
</head>
<body>

<header>

    <div class="contenedor"><img src="risa.jpg" class="mi-imagen">
