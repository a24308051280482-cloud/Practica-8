<!DOCTYPE html>
<html lang="en">
<head>
<title>Amazon</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

header {
  background-color: #232F3E;
  padding: 5px;
  text-align: center;
  font-size: 25px;
  color: white;
}
nav {
  float: up;
  width: 100%;
  height: 7vh;
  background: #333e48;
  padding: 20px; 
}

nav ul {
  list-style-type: none;
  padding: 0;
}

article {
  float: center;
  padding: 20px;
  width: 100  %;
  background-color: #f1f1f1;

}

section::after {
  content: "";
  display: table;
  clear: both;
}

footer {
  background-color: #333e48;
  padding: 10px;
  text-align: center;
  color: white;
}

.contenedor {
  display: flex;
  justify-content: flex-end;
  gap: 713px;
  align-items: center;
}

.mi-imagen {
  width: 300px;
  height: 200px;
}



@media (max-width: 600px) {
  nav, article {
    width: 100%;
    height: auto;
  }
}
</style>
</head>
<body>

<header>
  	<h2>Amazon</h2>
</header>

<section>
  <nav>
    <a href="" style="color: gold">Todo|</a>
    <a href="" style="color: gold">Libros|</a>
    <a href="" style="color: gold">Deportes|</a>
    <a href="" style="color: gold">Tecnologia</a>
  </nav>
  <article style="text-align: center;">
    <form action="/procesar-pago" method="POST">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez"> <br>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="tu@correo.com"><br>

            <label for="direccion">Dirección de Envío:</label>
            <input type="text" id="direccion" name="direccion" required placeholder="Calle, Número, Ciudad, Código Postal"><br>

            <label for="metodo_pago">Método de Pago:</label>
            <select id="metodo_pago" name="metodo_pago" required>
                <option value="">Selecciona un método de pago...</option>
                <option value="tarjeta">Tarjeta de Crédito / Débito</option>
                <option value="paypal">PayPal</option>
                <option value="transferencia">Transferencia Bancaria</option>
            </select><br>

            <button type="submit">Confirmar Pedido y Pagar</button>
        </form><br>
	</div>

  </article>
</section>
<footer>
  <p>Armando Eliseo Alvarez Carreon 24308051280428 4ºI Programacion</p>
</footer>

</body>
</html>
